<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>構成図モック</title>
<style>
:root { --ui-bg: #e9ebef; --ui-panel: #fff; --ui-border: #d8dbe2; --ui-text: #1c1c22; --ui-muted: #6b6b78; --ui-accent: #4f46e5; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ui-bg); color: var(--ui-text);
  font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Hiragino Sans", system-ui, sans-serif; }
.picker { position: sticky; top: 0; z-index: 10; background: var(--ui-panel); border-bottom: 1px solid var(--ui-border);
  padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.picker strong { margin-right: 6px; }
.picker .grp { font-size: 11px; color: var(--ui-muted); margin-left: 10px; }
.picker button { font: inherit; font-size: 12px; padding: 1px 9px; border: 1px solid var(--ui-border); background: var(--ui-panel);
  color: var(--ui-text); border-radius: 6px; cursor: pointer; }
.picker button.on { background: var(--ui-accent); border-color: var(--ui-accent); color: #fff; }
.stage { padding: 24px 16px 48px; display: flex; flex-direction: column; align-items: center; }

/* GitHub の README に見立てた枠 */
.readme { width: 880px; max-width: 100%; border-radius: 8px; padding: 24px 32px 32px;
  border: 1px solid var(--line); background: var(--page); color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
.readme h2 { font-size: 22px; margin: 0 0 16px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-weight: 600; }
.readme svg { display: block; width: 100%; height: auto; }
.note { width: 880px; max-width: 100%; margin: 12px auto 0; color: var(--ui-muted); font-size: 12px; }

/* 図の色。README では SVG に埋め込み、prefers-color-scheme で切り替える */
.readme, .readme[data-theme=light] {
  --page: #ffffff; --rg-slack: #f5f2fa; --rg-mac: #f1f4f8; --box: #ffffff; --chip: #eef0f4;
  --line: #d1d9e0; --text: #1f2328; --muted: #59636e; --accent: #4f46e5; --wire: #8c959f;
}
.readme[data-theme=dark] {
  --page: #0d1117; --rg-slack: #1a1824; --rg-mac: #151b23; --box: #0d1117; --chip: #212830;
  --line: #3d444d; --text: #f0f6fc; --muted: #9198a1; --accent: #8b93fa; --wire: #656c76;
}
svg .rg-slack { fill: var(--rg-slack); stroke: var(--line); }
svg .rg-mac { fill: var(--rg-mac); stroke: var(--line); }
svg .bx { fill: var(--box); stroke: var(--line); }
svg .core { fill: var(--box); stroke: var(--accent); stroke-width: 2; }
svg .chip { fill: var(--chip); }
svg .wire { stroke: var(--wire); stroke-width: 1.5; fill: none; }
svg .pipe { stroke: var(--accent); stroke-width: 3; fill: none; }
svg .ah { fill: var(--wire); } svg .ah-a { fill: var(--accent); }
svg text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
svg .h { font-size: 17px; font-weight: 700; }
svg .t { font-size: 14px; font-weight: 600; }
svg .b { font-size: 13px; }
svg .s { font-size: 12.5px; fill: var(--muted); }
svg .m { font-size: 12px; fill: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
svg .c { text-anchor: middle; }
svg .re { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
svg .lbl { paint-order: stroke; stroke: var(--rg-mac); stroke-width: 5px; stroke-linejoin: round; }
</style>
</head>
<body>

<div class="picker">
  <strong>構成図モック</strong>
  <span class="grp">言語</span>
  <button data-k="lang" data-v="ja" class="on">日本語</button>
  <button data-k="lang" data-v="en">English</button>
  <span class="grp">テーマ</span>
  <button data-k="theme" data-v="light" class="on">ライト</button>
  <button data-k="theme" data-v="dark">ダーク</button>
</div>

<div class="stage">
<div class="readme" id="readme" data-theme="light">

      <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-a" d="M0 0L10 5L0 10z"/></marker>
    </defs>

    <!-- Slack -->
    <rect class="rg-slack" x="16" y="16" width="376" height="340" rx="14"/>
    <text class="h" x="36" y="47">Slack</text>

    <rect class="bx" x="32" y="68" width="172" height="80" rx="8"/>
    <text class="t" x="48" y="92">#dev</text>
    <text class="b" x="48" y="116">👤 review app.ts</text>
    <text class="s" x="48" y="136" data-en="↳ 🤖 reply in thread">↳ 🤖 スレッドに返信</text>
    <rect class="bx" x="32" y="160" width="172" height="80" rx="8"/>
    <text class="t" x="48" y="184">#ops</text>
    <text class="b" x="48" y="208">👤 deploy prod</text>
    <text class="s" x="48" y="228" data-en="↳ 🤖 reply in thread">↳ 🤖 スレッドに返信</text>
    <rect class="bx" x="32" y="252" width="172" height="80" rx="8"/>
    <text class="t" x="48" y="276">DM</text>
    <text class="b" x="48" y="300" data-en="👤 buy milk">👤 牛乳を買う</text>
    <text class="s" x="48" y="320" data-en="↳ 🤖 reply in thread">↳ 🤖 スレッドに返信</text>

    <path class="wire" d="M204 108C224 108 220 200 240 200"/>
    <path class="wire" d="M204 200H240"/>
    <path class="wire" d="M204 292C224 292 220 200 240 200"/>

    <rect class="bx" x="240" y="152" width="136" height="96" rx="8"/>
    <text class="t" x="256" y="182" data-en="Your Slack app">Slack アプリ</text>
    <text class="s" x="256" y="206" data-en="Created just">SockDock 用に</text>
    <text class="s" x="256" y="224" data-en="for SockDock">1 つ作る</text>

    <!-- Mac -->
    <rect class="rg-mac" x="528" y="16" width="496" height="340" rx="14"/>
    <text class="h" x="548" y="47" data-en="Local Mac">ローカル環境の Mac</text>

    <rect class="core" x="552" y="112" width="236" height="176" rx="10"/>
    <text class="h" x="572" y="143">SockDock</text>
    <text class="s" x="572" y="165" data-en="Picks a rule for each post">投稿に合うルールを動かす</text>
    <rect class="chip" x="568" y="178" width="204" height="28" rx="6"/>
    <text class="b" x="580" y="197" data-en="#dev · starts with review">#dev ・ review で始まる</text>
    <rect class="chip" x="568" y="214" width="204" height="28" rx="6"/>
    <text class="b" x="580" y="233">#ops ・ <tspan class="re">^deploy \w+$</tspan></text>
    <rect class="chip" x="568" y="250" width="204" height="28" rx="6"/>
    <text class="b" x="580" y="269" data-en="DM · all posts">DM ・ すべての投稿</text>

    <path class="wire" d="M772 192C808 192 802 94 838 94" marker-end="url(#ah)"/>
    <path class="wire" d="M772 228C808 228 802 198 838 198" marker-end="url(#ah)"/>
    <path class="wire" d="M772 264C808 264 802 302 838 302" marker-end="url(#ah)"/>
    <text class="s c lbl" x="805" y="147" data-en="runs">実行</text>
    <text class="s c lbl" x="805" y="217" data-en="runs">実行</text>
    <text class="s c lbl" x="805" y="287" data-en="runs">実行</text>

    <rect class="bx" x="840" y="60" width="164" height="68" rx="8"/>
    <text class="t" x="856" y="88">Claude Code</text>
    <text class="m" x="856" y="110">~/projects/web-app</text>
    <rect class="bx" x="840" y="164" width="164" height="68" rx="8"/>
    <text class="t" x="856" y="192" data-en="Program">プログラム</text>
    <text class="m" x="856" y="214">~/ops/deploy.sh</text>
    <rect class="bx" x="840" y="268" width="164" height="68" rx="8"/>
    <text class="t" x="856" y="296">Claude Code</text>
    <text class="m" x="856" y="318">~/notes</text>

    <!-- 接続 -->
    <path class="pipe" d="M552 200H380" marker-end="url(#ahA)"/>
    <rect class="bx" x="406" y="167" width="108" height="27" rx="13.5"/>
    <text class="t c" x="460" y="186">Socket Mode</text>
  </svg>
</div>
<p class="note">README では、図を SVG（ライト・ダーク対応）として <code>assets/</code> に置く想定です。</p>
</div>

<script>
const state = { lang: 'ja', theme: 'light' };
const readme = document.getElementById('readme');
document.querySelectorAll('[data-en]').forEach(el => { el.dataset.ja = el.textContent; });
function render() {
  document.querySelectorAll('[data-en]').forEach(el => { el.textContent = el.dataset[state.lang]; });
  readme.dataset.theme = state.theme;
  document.querySelectorAll('.picker button').forEach(b => b.classList.toggle('on', state[b.dataset.k] === b.dataset.v));
}
document.querySelectorAll('.picker button').forEach(b => b.addEventListener('click', () => { state[b.dataset.k] = b.dataset.v; render(); }));
render();
</script>
</body>
</html>
