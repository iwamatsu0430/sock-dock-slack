<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SockDock for Slack</title>
<meta name="description" content="Post in Slack. Your Mac replies.">
<style>
:root {
  --bg: #ffffff; --bg-2: #f6f6f9; --text: #1b1a24; --muted: #646273; --border: #e4e3ea;
  --brand: #3C3489; --brand-text: #fff; --link: #3C3489;
  --chat: #ffffff; --chat-border: #dedde5; --code-bg: #f1f0f5; --react: #eceaf7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15141b; --bg-2: #1c1b24; --text: #ecebf2; --muted: #a09eb0; --border: #2e2d39;
    --brand: #8f86e8; --brand-text: #14131b; --link: #a9a2f0;
    --chat: #1f1e28; --chat-border: #34333f; --code-bg: #2a2934; --react: #2d2a45;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", system-ui, sans-serif; }
a { color: var(--link); }
h1, h2, h3, p { margin: 0; }
code { font: .88em ui-monospace, Menlo, monospace; background: var(--code-bg); border-radius: 4px; padding: 1px 5px; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
[hidden] { display: none !important; }

header .wrap { display: flex; align-items: center; gap: 10px; height: 64px; }
.mark { display: flex; align-items: center; gap: 10px; font-weight: 600; text-decoration: none; color: var(--text); }
.mark img { width: 28px; height: 28px; border-radius: 7px; }
header .spacer { flex: 1; }
.lang { font-size: 14px; color: var(--muted); }
.lang a { color: var(--muted); text-decoration: none; }
.lang a.on { color: var(--text); font-weight: 600; }

.hero .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 48px; row-gap: 36px; align-items: start; padding-top: 40px; padding-bottom: 72px; }
.hero h1 { grid-column: 1 / -1; font-size: 40px; line-height: 1.3; letter-spacing: -.015em; display: grid; gap: 4px; }
html[lang=ja] .hero h1 { font-size: 34px; letter-spacing: 0; }
.hero h1 em { font-style: normal; color: var(--brand); white-space: nowrap; }
html[lang=ja] h1, html[lang=ja] h2, html[lang=ja] strong { word-break: auto-phrase; }
.lead { font-weight: 600; }
.rule { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 14px; counter-reset: r; }
.rule li { counter-increment: r; display: grid; grid-template-columns: 28px 1fr; column-gap: 8px; font-size: 15px; }
.rule li::before { content: counter(r); grid-row: span 2; width: 24px; height: 24px; border-radius: 50%; background: var(--react); color: var(--brand); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.rule strong { display: block; }
.rule span { color: var(--muted); }
.ctas { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-block; padding: 11px 20px; border-radius: 8px; font-weight: 600; text-decoration: none; border: 1px solid var(--border); color: var(--text); }
.note { margin-top: 14px; font-size: 13px; color: var(--muted); max-width: 36em; }
.meta { margin-top: 18px; font-size: 14px; color: var(--muted); }

/* Slack-like thread (a simple drawing, not a copy of Slack's UI) */
.thread { background: var(--chat); border: 1px solid var(--chat-border); border-radius: 12px; padding: 20px; box-shadow: 0 12px 40px rgba(30,20,80,.08); font-size: 15px; }
.msg { display: grid; grid-template-columns: 36px 1fr; gap: 10px; }
.msg + .msg { margin-top: 16px; }
.av { width: 36px; height: 36px; border-radius: 8px; }
.av.person { background: linear-gradient(135deg, #f0b38a, #d97a7a); }
.who { font-weight: 700; font-size: 14px; }
.who span { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.reaction { display: inline-block; margin-top: 4px; font-size: 12px; background: var(--react); border-radius: 10px; padding: 0 8px; }
.threads { display: grid; gap: 16px; }
.channel { font-weight: 700; font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
.av.kid { background: linear-gradient(135deg, #9ad3a8, #5aa7c7); }
.replies { margin: 16px 0 0 46px; padding-left: 14px; border-left: 2px solid var(--chat-border); }

section.band { background: var(--bg-2); }
section .wrap.pad { padding-top: 72px; padding-bottom: 72px; }
h2 { font-size: 28px; letter-spacing: -.01em; }
.points { list-style: none; padding: 0; margin: 28px 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.points strong { display: block; margin-bottom: 4px; }
.points span { color: var(--muted); font-size: 15px; }
.steps { list-style: none; padding: 0; margin: 28px 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; counter-reset: s; }
.steps > li { counter-increment: s; border-top: 2px solid var(--brand); padding-top: 14px; }
.steps > li::before { content: counter(s); font-weight: 700; color: var(--brand); display: block; margin-bottom: 4px; }
.steps > li > strong { display: block; }
.steps > li > span { color: var(--muted); font-size: 15px; }
.kinds { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
.kinds li { font-size: 14px; padding-left: 12px; border-left: 2px solid var(--border); }
.kinds b { display: block; font-weight: 600; }
.kinds span { font-size: 14px; color: var(--muted); }
h3.behave-h { margin: 36px 0 0; font-size: 17px; }
.behave { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 6px; color: var(--muted); font-size: 15px; }
.final { margin-top: 48px; display: flex; flex-wrap: wrap; gap: 12px; }
.open-intro { margin-top: 14px; max-width: 40em; color: var(--muted); }
.open-steps { margin: 18px 0 0; padding-left: 22px; display: grid; gap: 8px; max-width: 40em; }
.open-safe { margin-top: 18px; max-width: 40em; font-size: 14px; color: var(--muted); }
.install { display: flex; align-items: center; gap: 4px; max-width: 100%; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 4px 4px 4px 14px; }
.install code { background: none; padding: 0; font-size: 14px; overflow-x: auto; white-space: nowrap; min-width: 0; flex: 1; }
.install code { scrollbar-width: none; }
.install code::-webkit-scrollbar { display: none; }
.install .copy { font: inherit; font-size: 13px; font-weight: 600; border: 0; border-radius: 6px; padding: 7px 12px; background: var(--brand); color: var(--brand-text); cursor: pointer; flex: none; }

footer { border-top: 1px solid var(--border); }
footer .wrap { padding-top: 28px; padding-bottom: 40px; font-size: 13px; color: var(--muted); display: grid; gap: 8px; }
footer nav { display: flex; flex-wrap: wrap; gap: 16px; }
footer nav a { color: var(--muted); }

@media (max-width: 820px) {
  .wrap { padding: 0 16px; }
  .hero .wrap { grid-template-columns: minmax(0, 1fr); gap: 36px; padding-top: 24px; padding-bottom: 48px; }
  .hero h1 { font-size: 28px; }
  html[lang=ja] .hero h1 { font-size: 24px; }
  .install { width: 100%; }
  .points, .steps { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .steps { gap: 20px; }
  section .wrap.pad { padding-top: 48px; padding-bottom: 48px; }
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="mark" href="#"><img src="../../assets/slack-icon.png" alt="">SockDock for Slack</a>
    <div class="spacer"></div>
    <div class="lang"><a href="#" data-set="en" class="on">English</a> · <a href="#" data-set="ja">日本語</a></div>
  </div>
</header>

<main>
<section class="hero">
  <div class="wrap">
    <h1 class="pair">
      <span data-en="Post <em>“ask”</em> in Slack, run <em>your AI agent</em>." data-ja="Slack に<em>「ask」</em>と投稿されたら、<em>AI エージェント</em>を動かす。"></span>
      <span data-en="Post <em>“play”</em>, launch <em>a game</em>." data-ja="Slack に<em>「遊ぼう」</em>と投稿されたら、<em>ゲーム</em>を起動する。"></span>
    </h1>
    <div class="body">
      <p class="lead" data-en="A rule sets three things." data-ja="ルールでは、次の 3 つを決めます。"></p>
      <ol class="rule">
        <li><strong data-en="Which channel" data-ja="どのチャンネルの投稿に反応するか"></strong><span data-en="e.g. <code>#side-project</code>. Anyone who can post there can trigger the rule, or restrict it to specific users." data-ja="例: <code>#個人開発</code>。このチャンネルに投稿できる人なら誰でも、このルールを動かせます。実行できるユーザーを制限することもできます。"></span></li>
        <li><strong data-en="Which posts" data-ja="どんな投稿に反応するか"></strong><span data-en="e.g. posts that start with “ask”. Any other post does nothing." data-ja="例: 「ask」で始まる投稿。当てはまらない投稿では、何も起きません。"></span></li>
        <li><strong data-en="What runs on your Mac" data-ja="Mac で何を実行するか"></strong><span data-en="e.g. an AI agent in <code>~/app</code>, allowed only to read files." data-ja="例: <code>~/app</code> フォルダで AI エージェント。ファイルの読み取りだけを許可します。"></span></li>
      </ol>
      <div class="ctas">
        <div class="install"><code>brew install --cask iwamatsu0430/tap/sockdock</code><button type="button" class="copy" data-en="Copy" data-ja="コピー"></button></div>
        <a class="btn" href="https://github.com/iwamatsu0430/sock-dock-slack" data-en="View on GitHub" data-ja="GitHub で見る"></a>
      </div>
      <p class="note" data-en="The app is not notarized by Apple, so opening it the first time takes an extra step. <a href=&quot;#first-open&quot;>How to open it</a>" data-ja="アプリは Apple の公証を受けていないため、初めて開くときに確認が要ります。<a href=&quot;#first-open&quot;>開き方</a>"></p>
      <p class="meta" data-en="macOS 13+ · Free and open source (MIT)" data-ja="macOS 13 以降 · 無料・オープンソース（MIT）"></p>
    </div>

    <div class="threads">
      <div class="thread" aria-label="Example Slack thread">
        <div class="channel" data-en="# side-project" data-ja="# 個人開発"></div>
        <div class="msg">
          <div class="av person"></div>
          <div>
            <div class="who">Aki <span>10:42</span></div>
            <div data-en="ask why does the login test fail?" data-ja="ask ログインのテストが落ちるのはなぜ？"></div>
          <div class="reaction">👀 1</div>
          </div>
        </div>
        <div class="replies">
        <div class="msg">
          <img class="av" src="../../assets/slack-icon.png" alt="">
          <div>
            <div class="who">SockDock <span>10:43</span></div>
            <div data-en="<code>test/login.spec.ts</code> expects a 302, but the handler now returns 303." data-ja="<code>test/login.spec.ts</code> は 302 を期待していますが、ハンドラは 303 を返すようになっています。"></div>
          </div>
        </div>
        <div class="msg">
          <div class="av person"></div>
          <div>
            <div class="who">Aki <span>10:44</span></div>
            <div data-en="where should I fix it?" data-ja="どこを直せばいい？"></div>
          </div>
        </div>
        <div class="msg">
          <img class="av" src="../../assets/slack-icon.png" alt="">
          <div>
            <div class="who">SockDock <span>10:44</span></div>
            <div data-en="Change 302 to 303 on line 12 of <code>test/login.spec.ts</code>." data-ja="<code>test/login.spec.ts</code> の 12 行目で、302 を 303 に変えれば通ります。"></div>
          </div>
        </div>
        </div>
      </div>
      <div class="thread" aria-label="Example Slack thread">
        <div class="channel" data-en="# family" data-ja="# 家族"></div>
        <div class="msg">
          <div class="av person kid"></div>
          <div>
            <div class="who">Hana <span>19:05</span></div>
            <div data-en="play" data-ja="遊ぼう"></div>
          <div class="reaction">👀 1</div>
          </div>
        </div>
        <div class="replies">
        <div class="msg">
          <img class="av" src="../../assets/slack-icon.png" alt="">
          <div>
            <div class="who">SockDock <span>19:05</span></div>
            <div data-en="Game launched." data-ja="ゲームを起動しました。"></div>
          </div>
        </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="band">
  <div class="wrap pad">
    <h2 data-en="It runs on your own Mac" data-ja="自分の Mac で動きます"></h2>
    <ul class="points">
      <li><strong data-en="Your files and tools, as they are" data-ja="手元のファイルをそのまま使う"></strong><span data-en="The AI agent works in a folder on your Mac, so it sees uncommitted changes and the tools you installed." data-ja="AI エージェントは Mac のフォルダで動くので、コミット前の変更も、Mac に入れたツールも使えます。"></span></li>
      <li><strong data-en="Your own AI agent" data-ja="いつもの AI エージェント"></strong><span data-en="It runs with your login, your instructions (like <code>CLAUDE.md</code>) and settings. No API key." data-ja="自分のログインで動き、<code>CLAUDE.md</code> などの指示や設定もそのまま効きます。API キーは要りません。"></span></li>
      <li><strong data-en="No server to set up" data-ja="サーバーは要りません"></strong><span data-en="SockDock connects from your Mac to Slack. No open ports, no public URL." data-ja="Mac から Slack へつなぐので、ポートを開けたり、公開 URL を用意したりしなくて済みます。"></span></li>
    </ul>
  </div>
</section>

<section>
  <div class="wrap pad">
    <h2 data-en="Set up in three steps" data-ja="3 つの手順で始める"></h2>
    <ol class="steps">
      <li><strong data-en="Create a Slack app" data-ja="Slack アプリを作成"></strong><span data-en="A button in SockDock opens Slack's create page with the permissions filled in. Then add the app to the channels you'll use." data-ja="SockDock のボタンから、必要な権限を入れた作成ページが開きます。作ったアプリを、使うチャンネルに追加します。"></span></li>
      <li><strong data-en="Paste its two tokens" data-ja="トークンを 2 つ貼る"></strong><span data-en="An App-Level Token (<code>xapp-</code>) to receive posts and a Bot Token (<code>xoxb-</code>) to reply. Both are kept in your Mac's Keychain." data-ja="投稿を受け取る App-Level Token（<code>xapp-</code>）と、返信する Bot Token（<code>xoxb-</code>）です。どちらも Mac のキーチェーンに保存します。"></span></li>
      <li><strong data-en="Add a rule" data-ja="ルールを作る"></strong><span data-en="In the menu bar app, choose a channel, which posts, and what runs." data-ja="メニューバーのアプリで、チャンネル・反応する投稿・実行するものを選びます。"></span>
        <ul class="kinds">
          <li><b data-en="AI agent (Claude Code for now)" data-ja="AI エージェント（いまは Claude Code）"></b><span data-en="Runs in the folder you pick. It can always read files; editing, web search and commands only if you allow them." data-ja="選んだフォルダで動きます。ファイルの読み取りは常に、編集・Web 検索・コマンドは許可したときだけできます。"></span></li>
          <li><b data-en="Program" data-ja="プログラム"></b><span data-en="Any script you write. What it prints becomes the reply." data-ja="自分で書いたスクリプトなど。標準出力がスレッドへの返信になります。"></span></li>
        </ul>
      </li>
    </ol>
    <h3 class="behave-h" data-en="In Slack" data-ja="Slack での動き"></h3>
    <ul class="behave">
      <li data-en="When a post matches a rule, 👀 appears; when it's done, 👀 goes away and the reply shows up in the thread." data-ja="投稿がルールに合うと 👀 が付き、終わると外れて、スレッドに返信が付きます。"></li>
      <li data-en="Reply in the thread to continue with the same rule — no keyword needed. The AI agent remembers the conversation." data-ja="スレッドに返信すると、同じルールで続きます。キーワードは要りません。AI エージェントは前のやりとりを覚えています。"></li>
    </ul>
    <div class="final">
      <a class="btn" href="https://github.com/iwamatsu0430/sock-dock-slack#readme" data-en="Read the README" data-ja="README を読む"></a>
    </div>
  </div>
</section>

<section class="band" id="first-open">
  <div class="wrap pad">
    <h2 data-en="Opening it the first time" data-ja="初めて開くとき"></h2>
    <p class="open-intro" data-en="SockDock is not notarized by Apple, so the first time you open it, macOS stops it with “SockDock” Not Opened." data-ja="SockDock は Apple の公証を受けていないため、初めて開くと macOS が「“SockDock” は開いていません」と表示して止めます。"></p>
    <ol class="open-steps">
      <li data-en="Click <b>Done</b> (not Move to Trash)." data-ja="<b>完了</b>を押します（「ゴミ箱に入れる」は押さない）。"></li>
      <li data-en="Open System Settings → Privacy &amp; Security, scroll down and click <b>Open Anyway</b>." data-ja="システム設定の「プライバシーとセキュリティ」を開き、下のほうにある<b>このまま開く</b>を押します。"></li>
      <li data-en="When asked again, click <b>Open</b>. From then on it opens normally." data-ja="確認が出たら<b>開く</b>を押します。次からはそのまま開けます。"></li>
    </ol>
    <p class="open-safe" data-en="This allows SockDock only; the rest of your Mac's protection stays on. Homebrew checks the download against the checksum recorded in the tap before installing it. <a href=&quot;https://support.apple.com/en-us/102445&quot;>Apple Support: Safely open apps on your Mac</a>" data-ja="許可されるのは SockDock だけで、Mac の保護はそのまま働きます。Homebrew は、ダウンロードしたファイルが tap に記録されたハッシュと一致することを確かめてから入れます。<a href=&quot;https://support.apple.com/ja-jp/102445&quot;>Apple サポート「Mac でアプリを安全に開く」</a>"></p>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <nav>
      <a href="https://github.com/iwamatsu0430/sock-dock-slack">GitHub</a>
      <a href="https://github.com/iwamatsu0430/sock-dock-slack#readme">README</a>
      <a href="https://github.com/iwamatsu0430/sock-dock-slack/blob/main/LICENSE">MIT License</a>
      <a href="https://github.com/iwamatsu0430/sock-dock-slack/blob/main/SECURITY.md">Security</a>
    </nav>
    <p>SockDock is not affiliated with, created by, or supported by Slack Technologies, LLC.</p>
  </div>
</footer>

<script>
// Mock only: the real site has / and /ja/ as two static pages.
function setLang(l) {
  document.documentElement.lang = l;
  document.querySelectorAll('[data-en]').forEach(el => { el.innerHTML = el.dataset[l]; });
  document.querySelectorAll('.lang a').forEach(a => a.classList.toggle('on', a.dataset.set === l));
}
document.querySelectorAll('.lang a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); setLang(a.dataset.set); }));
document.querySelectorAll('.copy').forEach(b => b.addEventListener('click', () => {
  navigator.clipboard?.writeText(b.previousElementSibling.textContent).catch(() => {});
  const t = b.textContent; b.textContent = '✓'; setTimeout(() => { b.textContent = t; }, 1200);
}));
setLang(location.hash === '#ja' || (location.hash !== '#en' && /^ja\b/i.test((navigator.languages || [])[0] || navigator.language || '')) ? 'ja' : 'en');
</script>
</body>
</html>
