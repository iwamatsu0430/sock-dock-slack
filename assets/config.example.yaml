# SockDock for Slack — example config.
# macOS: ~/Library/Application Support/sockdock/config.yaml
# Linux: $XDG_CONFIG_HOME/sockdock/config.yaml
# Validate with: sockdock check

settings:
  max_concurrency: 3        # handlers running at the same time
  thread_ttl_days: 30       # how long a thread stays bound to its route
  ack_reaction: eyes        # reaction added while a message is being handled
  claude_command: claude    # used by claude handlers; prefer an absolute path under launchd
  language: auto            # messages posted to Slack: auto (system language), en, ja
  # path: ["/opt/homebrew/bin"]   # extra PATH entries for handlers
  # secrets_file: secrets.env     # SLACK_APP_TOKEN / SLACK_BOT_TOKEN (chmod 600), if not in env or Keychain
  # messages:
  #   timeout: "⏱ Timed out after {timeout_sec}s."
  #   error: "⚠️ Something went wrong (route: {route})."

routes:
  # Within a channel, routes are tried from the top; the first match runs.
  # A command handler: gets the event JSON on stdin, its stdout is posted to the thread.
  - name: echo
    channel: C0123456789
    starts_with: echo         # or contains: …, match: '<regex>', all_posts: true
    handler:
      type: command
      cwd: ~/sockdock-handlers
      command: ["./echo.sh"]
      timeout_sec: 60

  # A Claude Code handler: each thread is one conversation, resumed on every reply.
  # - name: assistant
  #   channel: ${ASSISTANT_CHANNEL_ID}          # ${VAR} comes from env_file, then the environment
